    <meta property="og:type" content="website" />

    <!-- No logo preload: the mark is now an 8 KB WebP served through Vite's
         hashed asset pipeline, so its filename isn't knowable here. It was
         only worth preloading when it was a 301 KB PNG. -->

    <!--
      Scroll-reveal sections render at opacity 0 until an observer fires, so
      prerendered HTML ships with that hidden state baked in. Crawlers still
      read the text, but a visitor whose JS fails would see a blank page.
      These rules apply only when scripting is off.
    -->
    <noscript>
      <style>
        .scroll-anim,
        [style*="opacity: 0"],
        [style*="opacity:0"] {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
